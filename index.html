<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <meta name="description" content="GymLog Pro — jurnal de sală rapid, tip tabel, cu analiză vizuală a progresului și profil biometric. Proiect TPI.">
  <title>GymLog Pro · Jurnal de Sală & Analiză Progres</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237b8cff'/%3E%3Cpath d='M19 22v20M45 22v20M12 27v10M52 27v10M19 32h26' stroke='%230b1020' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">

  <!-- Aplicație instalabilă pe telefon (PWA): iconițe + mod ecran complet -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymLog">
  <script>
    // Manifestul se încarcă doar de pe un link http(s); pe file:// browserul l-ar bloca (CORS).
    if (location.protocol !== 'file:') {
      var m = document.createElement('link'); m.rel = 'manifest'; m.href = 'manifest.webmanifest'; document.head.appendChild(m);
    }
  </script>

  <!-- Font Inter (opțional: offline se folosește fontul sistemului) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

  <!-- Stilurile aplicației (tokenuri Dark Mode + componente) -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Tailwind CSS v4 (CDN). Dacă CDN-ul nu răspunde → copia locală din js/vendor/ -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.5/dist/index.global.js"
          onerror="var s=document.createElement('script');s.src='js/vendor/tailwind-browser.js';document.head.appendChild(s);"></script>

  <!-- Chart.js 4 (CDN) + copie locală de rezervă pentru lucru offline -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js"></script>
  <script>window.Chart || document.write('<script src="js/vendor/chart.umd.min.js"><\/script>');</script>
</head>

<body>
  <!-- ============================ ANTET + NAVIGAȚIE ============================ -->
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#antrenament" aria-label="GymLog Pro — pagina de antrenament">
        <span class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7v10M17 7v10M3.5 9.5v5M20.5 9.5v5M7 12h10"/></svg>
        </span>
        <span>
          <span class="brand-name">GymLog <b>Pro</b></span>
          <span class="brand-sub">Jurnal de sală &amp; analiză progres</span>
        </span>
      </a>

      <!-- Pe desktop: în antet. Pe mobil (CSS): bară fixă jos. -->
      <nav class="tabs" id="tabs" aria-label="Secțiunile aplicației">
        <a class="tab" href="#antrenament" data-tab="log">
          <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 7v10M17 7v10M3.5 9.5v5M20.5 9.5v5M7 12h10"/></svg>
          <span>Antrenament</span>
        </a>
        <a class="tab" href="#istoric" data-tab="history">
          <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
          <span>Istoric</span>
        </a>
        <a class="tab" href="#progres" data-tab="progress">
          <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M6 16v-4"/><path d="M11 16V8"/><path d="M16 16v-6"/><path d="M4 9l6-5 5 4 5-4"/></svg>
          <span>Progres</span>
        </a>
        <a class="tab" href="#corp" data-tab="body">
          <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="6.5" r="3.5"/><path d="M5 21c0-4.2 3.1-7.5 7-7.5s7 3.3 7 7.5"/></svg>
          <span>Corp</span>
        </a>
        <a class="tab" href="#setari" data-tab="settings">
          <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
          <span>Setări</span>
        </a>
      </nav>

      <div class="save-status" id="save-status" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span class="txt hidden lg:inline">Salvat automat</span>
      </div>
    </div>
  </header>

  <!-- ============================ CONȚINUT (randat de js/app.js) ============================ -->
  <main id="main" class="wrap">
    <section class="view" id="view-log" data-view="log" aria-label="Antrenament"></section>
    <section class="view" id="view-history" data-view="history" aria-label="Istoric"></section>
    <section class="view" id="view-progress" data-view="progress" aria-label="Progres și statistici"></section>
    <section class="view" id="view-body" data-view="body" aria-label="Profil biometric"></section>
    <section class="view" id="view-settings" data-view="settings" aria-label="Setări și date"></section>
  </main>

  <!-- ============================ CRONOMETRU DE PAUZĂ (plutitor) ============================ -->
  <aside class="rest-timer" id="rest-timer" aria-label="Cronometru de pauză" aria-hidden="true">
    <div class="rt-ring">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="bg" cx="50" cy="50" r="44" fill="none" stroke-width="8"/>
        <circle class="fg" id="rt-progress" cx="50" cy="50" r="44" fill="none" stroke-width="8" stroke-dasharray="276.46" stroke-dashoffset="0"/>
      </svg>
      <div class="rt-time" id="rt-time" role="timer" aria-live="off">1:30</div>
    </div>
    <div class="rt-body">
      <div class="rt-label" id="rt-label"><b>Pauză</b><span>—</span></div>
      <div class="rt-presets" role="group" aria-label="Durată pauză">
        <button type="button" data-action="timer-preset" data-sec="60">60s</button>
        <button type="button" data-action="timer-preset" data-sec="90">90s</button>
        <button type="button" data-action="timer-preset" data-sec="120">120s</button>
      </div>
      <div class="rt-controls">
        <button type="button" class="rt-main" data-action="timer-toggle" id="rt-toggle">Pauză</button>
        <button type="button" data-action="timer-reset">Reset</button>
        <button type="button" data-action="timer-add">+15s</button>
      </div>
    </div>
    <button type="button" class="icon-btn xs rt-close" data-action="timer-close" aria-label="Închide cronometrul">
      <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </aside>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <noscript>
    <div style="padding:24px;text-align:center">GymLog Pro are nevoie de JavaScript activat.</div>
  </noscript>

  <!-- ============================ MODULE JS (ordinea contează) ============================ -->
  <script src="js/data.js"></script>      <!-- exerciții, șabloane, istoric real -->
  <script src="js/storage.js"></script>   <!-- localStorage + export/import JSON -->
  <script src="js/stats.js"></script>     <!-- calcule: PR, progres, IMC, calorii -->
  <script src="js/charts.js"></script>    <!-- grafice Chart.js -->
  <script src="js/app.js"></script>       <!-- interfață: tabele, timer, tab-uri -->
</body>
</html>
